name: divyang_matrimony
description: "Divyang Matrimony — Matrimony platform for people with disabilities in India."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- State Management & DI (Riverpod — ADR-008) ---
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # --- Routing ---
  go_router: ^14.8.1

  # --- Networking ---
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4

  # --- Firebase ---
  firebase_core: ^3.13.0
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4

  # --- Local Storage ---
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # --- Payments ---
  razorpay_flutter: ^1.3.7

  # --- Image Handling ---
  image_picker: ^1.1.2
  image: ^4.5.3                # Client-side resizing (Section 4.2)
  cached_network_image: ^3.4.1

  # --- UI Utilities ---
  intl: ^0.20.2                # Localization, date/currency formatting
  url_launcher: ^6.3.1         # WhatsApp deep links (Section 4.6)
  shimmer: ^3.0.0              # Loading placeholders
  flutter_svg: ^2.0.17

  # --- Utilities ---
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  freezed_annotation: ^3.0.0
  uuid: ^4.5.1
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # --- Code Generation ---
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
  freezed: ^3.0.4
  riverpod_generator: ^2.6.4

  # --- Testing ---
  mocktail: ^1.0.4
  # integration_test provided by Flutter SDK

flutter:
  uses-material-design: true
  generate: true              # Enable flutter_localizations codegen

  assets:
    - assets/images/
    - assets/icons/
