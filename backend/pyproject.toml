[project]
name = "divyang-matrimony-api"
version = "1.0.0"
description = "Backend API for Divyang Matrimony platform"
requires-python = ">=3.12"

dependencies = [
    # --- Web Framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # --- Validation / Settings ---
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # --- Security ---
    # PyJWT replaces python-jose (unmaintained since 2023).
    # argon2-cffi replaces bcrypt — Argon2id is the OWASP-recommended algorithm
    # for new systems (winner of Password Hashing Competition, memory-hard).
    "PyJWT>=2.10.0",                      # JWT encode/decode
    "argon2-cffi>=23.1.0",               # Argon2id password hashing (admin accounts)
    "python-multipart>=0.0.20",          # Form data / file uploads

    # --- Redis (cache + rate-limit, v1) ---
    "redis[hiredis]>=5.2.0",

    # --- Firebase ---
    "firebase-admin>=6.6.0",
    "google-cloud-storage>=2.18.0",   # Signed URL generation for private bucket (§4.2)
    "Pillow>=11.0.0",                 # Server-side EXIF/GPS strip from uploads (§4.2)

    # --- Payments ---
    "razorpay>=1.4.2",

    # --- HTTP Client ---
    "httpx>=0.28.0",

    # --- Logging ---
    "structlog>=24.4.0",

    # --- Scheduling (replaces Celery for v1 -- Section 3.7) ---
    "apscheduler>=3.10.4",

    # --- Error Tracking ---
    "sentry-sdk[fastapi]>=2.19.0",

    # --- Utilities ---
    "python-dotenv>=1.0.0",
    "email-validator>=2.2.0",
    "cryptography>=44.0.0",           # AES-256-GCM field-level encryption (§5.2)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",               # TestClient
    "factory-boy>=3.3.0",          # Test data factories
    "aiosqlite>=0.20.0",           # In-memory async DB for repository/API tests — see tests/conftest.py
    "ruff>=0.8.0",                 # Linter + formatter
    "mypy>=1.13.0",                # Type checker
    "pip-audit>=2.7.0",            # Dependency vulnerability scanning
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "SIM"]
ignore = ["S101"]  # Allow assert in tests

[tool.ruff.lint.per-file-ignores]
# Test fixtures assign literal tokens/passwords/jtis to variables and
# kwargs named like the real thing (e.g. `password_hash="hash"`,
# `refresh_token_jti="some-jti"`) — bandit's hardcoded-password heuristic
# (S105/S106) can't tell that apart from a real secret, but nothing here
# is one.
"tests/**" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # Starlette's TestClient still uses httpx directly; harmless for tests.
    "ignore::DeprecationWarning:starlette.testclient",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
