# ======================================================================
# Nginx Reverse Proxy Configuration
# ======================================================================
# TLS termination, routes /api/* to FastAPI, serves Flutter Web static.
# See Architecture Section 17.
# ======================================================================

upstream api_server {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # Redirect HTTP to HTTPS in production
    # Uncomment the following for production:
    # return 301 https://$host$request_uri;

    # --- API routes ---
    location /api/ {
        proxy_pass http://api_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Request size limit (10MB for document uploads)
        client_max_body_size 10M;
    }

    # --- Health check (pass-through) ---
    location /health {
        proxy_pass http://api_server/api/v1/health;
    }

    # --- API docs (dev only) ---
    location /docs {
        proxy_pass http://api_server/docs;
    }
    location /redoc {
        proxy_pass http://api_server/redoc;
    }
    location /openapi.json {
        proxy_pass http://api_server/openapi.json;
    }

    # --- Flutter Web static files ---
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # --- Security headers ---
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS — uncomment in production after confirming HTTPS works
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

